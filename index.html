<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="assets/json/aframe.min.js"></script>
    <script src="assets/json/Mindar-image-aframe.prod.js"></script>
    <style>
      #top-left-logo {
        position: fixed;
        left: 16px;
        width: 100px;
        top: 16px;
        height: auto;
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="top-left-logo" src="assets/VV_logo.png" alt="VV logo" />

    <a-scene
      mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 10; missTolerance: 15"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <img id="card" src="assets/AR_laag.jpg" />
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane src="#card" position="0 0 0" height="1.5" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      (function () {
        var scene = document.querySelector("a-scene");
        var topLogo = document.getElementById("top-left-logo");
        if (!scene || !topLogo) return;

        scene.addEventListener("loaded", function () {
          topLogo.style.display = "block";
        });
      })();
    </script>
  </body>
</html>
